name: Publish to crates.io

on:
    release:
        types: [published]

jobs:
    publish:
        if: github.event.release.target_commitish == 'master'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2

            - name: Verify (fmt, clippy, tests)
              run: |
                  cargo clippy --all-targets -- -D warnings
                  cargo test --all

            - name: Check tag matches Cargo.toml version
              shell: bash
              run: |
                  CRATE_VERSION=$(cargo metadata --no-deps --format-version=1 | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -n1)
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  echo "Cargo.toml version: $CRATE_VERSION"
                  echo "Release tag version: $TAG_VERSION"
                  test "$CRATE_VERSION" = "$TAG_VERSION"

            - name: Publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: cargo publish
